name: CI Workflow

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run tests
        run: |
          cd backend
          pytest

      - name: Build frontend
        run: |
          cd frontend
          npm install
          npm run build

      - name: Lint code
        run: |
          cd backend
          flake8 .
          cd ../frontend
          npm run lint

      - name: Upload coverage
        run: |
          cd backend
          coverage run -m pytest
          coverage report
          coverage html

      - name: Notify on success
        if: success()
        run: echo "CI build succeeded!"